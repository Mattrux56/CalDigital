<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Conversiones y ALU</title>
    <!-- Estilos base y modulares de tu carpeta css -->
    <link rel="stylesheet" href="./Calculadora/static/css/base.css">
    <link rel="stylesheet" href="./Calculadora/static/css/layout.css">
    <link rel="stylesheet" href="./Calculadora/static/css/sidebar.css">
    <link rel="stylesheet" href="./Calculadora/static/css/components.css">
    <link rel="stylesheet" href="./Calculadora/static/css/conversion.css">
    <link rel="stylesheet" href="./Calculadora/static/css/alu.css">
    <link rel="stylesheet" href="./Calculadora/static/css/style.css">
</head>

<body>

<header>
    <div class="header-content">
        <p class="eyebrow">ELECTRONICA DIGITAL</p>
        <h1>Motor de Conversiones y ALU</h1>
        <p class="subtitle">Bases numericas y aritmetica de bajo nivel</p>
    </div>
</header>

<div class="app-shell">
    <aside class="sidebar" aria-label="Herramientas">
        <p class="sidebar-title">Herramientas</p>
        <nav class="sidebar-nav" role="tablist" aria-label="Tipo de calculo">
            <button class="nav-button is-active" type="button" role="tab"
                aria-selected="true" data-view-target="conversion-view">
                <span class="nav-number">01</span>
                <span class="nav-copy">Conversion<small>Multibase</small></span>
            </button>
            <button class="nav-button" type="button" role="tab"
                aria-selected="false" data-view-target="alu-view">
                <span class="nav-number">02</span>
                <span class="nav-copy">ALU<small>Operaciones logicas</small></span>
            </button>
        </nav>
    </aside>
    <main>
        <conversion-view></conversion-view>
        <alu-view></alu-view>
    </main>
</div>

<footer>
    <p>Proyecto de Electronica Digital - Mateo Vargas</p>
</footer>

<!-- Carga del Web Component principal -->
<script type="module" src="./Calculadora/static/js/script.js"></script>

</body>
</html>
